[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "book-system"
version = "0.1.0"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov=book_system --cov-branch --cov-report=term-missing"
markers = [
    "integration: integration tests",
]

[tool.coverage.run]
branch = true
source = ["book_system"]

[tool.coverage.report]
show_missing = true
fail_under = 80